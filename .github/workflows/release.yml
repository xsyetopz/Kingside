name: Release

# Builds a signed release for every platform from a version tag: a notarized macOS DMG attached to a
# draft GitHub release, and iOS and tvOS builds uploaded to App Store Connect for TestFlight.
# docs/releasing.md lists the secrets and how Tools/release-secrets.sh sets them.

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, for example 1.2.0 or 1.2.0-rc.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "::error::$TAG is not MAJOR.MINOR.PATCH with an optional -alpha.N, -beta.N, or -rc.N"
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.platform }})
    needs: tag
    runs-on: macos-26
    # A clang probe in Xcode 26.6's build service can block forever on a full stderr pipe.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            cert: DEVELOPER_ID_APPLICATION
            profile: KINGSIDE_MACOS_PROFILE_BASE64
          - platform: iOS
            cert: APPLE_DISTRIBUTION
            profile: KINGSIDE_IOS_PROFILE_BASE64
          - platform: tvOS
            cert: APPLE_DISTRIBUTION
            profile: KINGSIDE_TVOS_PROFILE_BASE64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
      - name: Install signing certificate and profile
        id: signing
        env:
          KEYCHAIN_SECRET: ${{ secrets.KEYCHAIN_SECRET }}
          CERT_BASE64: ${{ secrets[format('{0}_CERT_BASE64', matrix.cert)] }}
          CERT_SECRET: ${{ secrets[format('{0}_CERT_SECRET', matrix.cert)] }}
          PROFILE_BASE64: ${{ secrets[matrix.profile] }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          profile=$(Tools/release-keychain.sh)
          echo "profile=$profile" >>"$GITHUB_OUTPUT"
          [ -n "$KEY_BASE64" ] || { echo "::error::Missing secret APP_STORE_CONNECT_KEY_BASE64"; exit 1; }
          printf '%s' "$KEY_BASE64" | base64 --decode >"$RUNNER_TEMP/AuthKey.p8"
      - name: Build, sign, and ${{ matrix.platform == 'macOS' && 'notarize' || 'upload to TestFlight' }}
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ needs.tag.outputs.tag }}
          BUILD: ${{ github.run_number }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          APP_STORE_CONNECT_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" \
            Tools/release.sh "$PLATFORM" "$TAG" "$BUILD" "$RUNNER_TEMP/release"
      - if: matrix.platform == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kingside-macOS
          path: ${{ runner.temp }}/release/Kingside-*-macOS.dmg
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          Tools/release-keychain.sh --delete
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  # Leaves the release as a draft with the DMG attached; publishing it on GitHub makes it public.
  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Kingside-macOS
          path: ${{ runner.temp }}/release
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kingside ${{ needs.tag.outputs.tag }}
          files: ${{ runner.temp }}/release/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: ${{ needs.tag.outputs.prerelease }}
